name: CI

# Запускаем проверки на каждый пуш в main и на каждый pull request.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Бэкенд — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Прогнать тесты бэкенда
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  android-build:
    name: Android — сборка debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # На раннерах GitHub Android SDK уже установлен заранее — не ставим его повторно
      # через android-actions/setup-android (этот экшен последнее время ломается на
      # принятии лицензий для устаревшего пакета "tools", которого больше нет в репозитории
      # Google). Просто принимаем лицензии для SDK, который уже есть на диске.
      - name: Принять лицензии Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Собрать приложение (debug)
        working-directory: androidApp
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
