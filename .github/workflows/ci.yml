name: CI

# Проверки на каждый пуш в main и на каждый pull request.
# Репозиторий публичный — минуты GitHub Actions для него бесплатны, поэтому гоняем всё:
#   1) тесты бэкенда (на встроенной базе H2) + сборка fat-jar;
#   2) смоук-тест НАСТОЯЩЕГО Docker-образа на настоящем Postgres — ровно как на сервере;
#   3) Android: юнит-тесты + сборка debug и release (R8);
#   4) Android: UI-тесты Compose на настоящем эмуляторе.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # кнопка «Run workflow» во вкладке Actions — прогнать вручную

# Новый пуш в ту же ветку отменяет ещё идущую проверку старого — не жжём минуты впустую.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Бэкенд — тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Прогнать тесты и собрать fat-jar
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew test buildFatJar --no-daemon
      # Упали тесты — выкладываем HTML-отчёт Gradle: в нём видно, какой тест и почему.
      - name: Отчёт о тестах (если упали)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/build/reports/tests/
          retention-days: 7
      # jar передаём следующему job — смоук-тест соберёт из него Docker-образ.
      - name: Сохранить jar
        uses: actions/upload-artifact@v4
        with:
          name: expenses-backend-jar
          path: backend/build/libs/expenses-backend-all.jar
          retention-days: 7

  docker-smoke:
    name: Docker-образ — смоук-тест на Postgres
    needs: backend-tests
    runs-on: ubuntu-latest
    # Настоящий Postgres 16 рядом с job — как контейнер expenses-pg на сервере.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expenses
          POSTGRES_PASSWORD: ci-password
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: expenses-backend-jar
          path: deploy/server/backend
      # Тот же Dockerfile, что на сервере (deploy/server/backend/Dockerfile).
      - name: Собрать образ бэкенда
        run: docker build -t expenses-backend:ci deploy/server/backend
      # Без BOT_TOKEN и GROQ_API_KEY: бот и ИИ выключены, остальное обязано работать.
      - name: Запустить контейнер
        run: |
          docker run -d --name expenses --network host \
            -e HOST=127.0.0.1 -e PORT=8080 \
            -e DB_URL=jdbc:postgresql://127.0.0.1:5432/expenses -e DB_USER=postgres -e DB_PASSWORD=ci-password \
            expenses-backend:ci
      - name: Дождаться /health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs expenses; exit 1
      # Сквозной сценарий: регистрация → трата → список → CSV; чужой токен трату не видит.
      - name: Сквозной сценарий API
        run: |
          set -e
          B=http://127.0.0.1:8080
          T1=$(curl -fs -X POST $B/api/register -H 'Content-Type: application/json' -d '{"name":"CI"}' | jq -r .token)
          T2=$(curl -fs -X POST $B/api/register -H 'Content-Type: application/json' -d '{"name":"Другой"}' | jq -r .token)
          curl -fs -X POST $B/api/expenses -H "Authorization: Bearer $T1" -H 'Content-Type: application/json' \
            -d '{"amount":250,"category":"такси"}' > /dev/null
          curl -fs $B/api/expenses -H "Authorization: Bearer $T1" | jq -e 'length == 1 and .[0].amount == 250' > /dev/null
          curl -fs $B/api/expenses -H "Authorization: Bearer $T2" | jq -e 'length == 0' > /dev/null
          curl -fs $B/api/expenses.csv -H "Authorization: Bearer $T1" | grep -q "такси"
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/expenses)" = "401"
          curl -fs $B/install.html | grep -q "Установить Expenses"
          echo "регистрация, трата, изоляция пользователей, CSV, авторизация и страницы работают"
      - name: Лог контейнера
        if: always()
        run: docker logs expenses 2>&1 | tail -50

  android-build:
    name: Android — тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # На раннерах GitHub Android SDK уже установлен заранее — не ставим его повторно
      # через android-actions/setup-android (этот экшен последнее время ломается на
      # принятии лицензий для устаревшего пакета "tools", которого больше нет в репозитории
      # Google). Просто принимаем лицензии для SDK, который уже есть на диске.
      - name: Принять лицензии Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      # Юнит-тесты (ViewModel, расчёты, синхронизация с поддельным сервером, Room через
      # Robolectric) + debug + release. Release — с R8: он ломается иначе, чем debug
      # (выкинутый «неиспользуемый» класс, который на деле нужен через рефлексию), поэтому
      # собираем его на каждый пуш, а не только перед выкладкой.
      - name: Юнит-тесты и сборка (debug + release)
        working-directory: androidApp
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Отчёт юнит-тестов (если упали)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: androidApp/app/build/reports/tests/
          retention-days: 7
      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: expenses-apk
          path: androidApp/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  android-ui-tests:
    name: Android — UI-тесты на эмуляторе
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Эмулятору нужна аппаратная виртуализация (KVM) — на раннерах GitHub она есть,
      # но по умолчанию недоступна обычному пользователю. Открываем доступ.
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Принять лицензии Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      # Экшен скачивает образ Android, запускает эмулятор без окна, ждёт загрузки
      # и выполняет script; после — гасит эмулятор. Анимации выключены — тесты стабильнее.
      - name: UI-тесты Compose (connectedDebugAndroidTest)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: androidApp
          script: chmod +x ./gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Отчёт UI-тестов (если упали)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-report
          path: androidApp/app/build/reports/androidTests/
          retention-days: 7
