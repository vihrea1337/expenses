<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои траты</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1a1a1a;
            --muted: #6b7280;
            --accent: #2e7d32;
            --border: #e3e5e8;
            --danger: #c0392b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181c; --card: #22262c; --text: #e8eaed;
                --muted: #9aa0a6; --border: #333840;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 16px; background: var(--bg); color: var(--text);
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            display: flex; justify-content: center;
        }
        .wrap { width: 100%; max-width: 560px; }
        h1 { font-size: 22px; margin: 8px 0 16px; }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin-bottom: 16px;
        }
        form { display: flex; flex-wrap: wrap; gap: 8px; }
        input {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
            background: transparent; color: var(--text); font-size: 15px;
        }
        #category { flex: 1 1 160px; }
        #amount { width: 110px; }
        #note { flex: 1 1 100%; }
        #token { flex: 1 1 100%; }
        button {
            padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer;
            background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
        }
        button:disabled { opacity: .6; cursor: default; }
        #addBtn, #loginBtn { flex: 1 1 100%; }
        .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; }
        .linkbtn {
            background: transparent; color: var(--muted); font-weight: 400;
            font-size: 13px; padding: 4px 8px;
        }
        .periods { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .periods button {
            flex: 1; background: var(--card); color: var(--text);
            border: 1px solid var(--border); font-weight: 500; padding: 8px 10px;
        }
        .periods button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .total { font-size: 15px; color: var(--muted); margin: 4px 2px 12px; }
        .total b { color: var(--text); font-size: 18px; }
        .bd-title { font-weight: 600; margin-bottom: 8px; }
        .bd-row { padding: 8px 2px; }
        .bd-head { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; gap: 8px; }
        .bd-head span:last-child { color: var(--muted); white-space: nowrap; }
        .bd-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
        .bd-bar > div { height: 100%; background: var(--accent); }
        .donut { width: 170px; height: 170px; border-radius: 50%; margin: 8px auto 16px; position: relative; }
        .donut-hole {
            position: absolute; inset: 34px; border-radius: 50%; background: var(--card);
            display: flex; align-items: center; justify-content: center;
        }
        .donut-hole span { font-weight: 600; font-size: 15px; }
        .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
        .row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 4px; border-bottom: 1px solid var(--border);
        }
        .row:last-child { border-bottom: none; }
        .row .info { flex: 1; min-width: 0; }
        .row .cat { font-size: 16px; }
        .row .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .row .amt { font-size: 16px; font-weight: 600; white-space: nowrap; }
        .del {
            background: transparent; color: var(--danger); font-size: 18px;
            padding: 4px 8px; font-weight: 400;
        }
        .edit {
            background: transparent; color: var(--muted); font-size: 16px;
            padding: 4px 8px; font-weight: 400;
        }
        .empty { color: var(--muted); text-align: center; padding: 24px 0; }
        .error { color: var(--danger); margin: 8px 2px; min-height: 18px; }
        .who { color: var(--muted); font-size: 13px; margin-top: 2px; }
        /* График «по времени»: одна серия столбиков одного акцентного цвета. */
        .trend-bars { display: flex; align-items: flex-end; gap: 2px; height: 120px; margin-top: 8px; }
        .tbar { flex: 1; height: 100%; display: flex; align-items: flex-end; }
        .tbar-fill { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }
        .trend-labels { display: flex; gap: 2px; margin-top: 4px; }
        .trend-labels span {
            flex: 1; text-align: center; font-size: 11px; color: var(--muted);
            white-space: nowrap; overflow: hidden;
        }
        .hidden { display: none; }
        /* Подсказка при наведении на сектор кольцевой диаграммы — следует за курсором. */
        .donut-tip {
            position: fixed; pointer-events: none; z-index: 10;
            background: var(--card); border: 1px solid var(--border); border-radius: 6px;
            padding: 4px 8px; font-size: 13px; box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div>
            <h1>💸 Мои траты</h1>
            <div class="who hidden" id="who"></div>
        </div>
        <button id="logoutBtn" class="linkbtn hidden" type="button">Сменить токен</button>
    </div>

    <!-- Экран входа: показывается, пока не введён верный токен. -->
    <div class="card" id="loginCard">
        <form id="loginForm">
            <input id="token" type="password" placeholder="Токен доступа" required>
            <button id="loginBtn" type="submit">Войти</button>
        </form>
        <div class="error" id="loginError"></div>
        <div class="hint">Нет аккаунта? Создай новый — получишь токен для входа.</div>
        <button id="registerBtn" type="button" style="width:100%;margin-top:8px">Зарегистрироваться</button>
    </div>

    <!-- Основной интерфейс: показывается после входа. -->
    <div id="appArea" class="hidden">
        <div class="card">
            <form id="addForm">
                <input id="category" placeholder="Категория (напр. кофе)" required>
                <input id="amount" placeholder="Сумма" inputmode="decimal" required>
                <input id="note" placeholder="Заметка (необязательно)">
                <button id="addBtn" type="submit">Добавить трату</button>
            </form>
            <div class="error" id="error"></div>
        </div>

        <div class="card" id="budget"></div>

        <div class="periods" id="periods">
            <button type="button" data-period="today">Сегодня</button>
            <button type="button" data-period="week">Неделя</button>
            <button type="button" data-period="month" class="active">Месяц</button>
            <button type="button" data-period="all">Всё</button>
        </div>

        <div class="total" id="total"></div>

        <div style="text-align:right;margin:-6px 2px 12px">
            <button id="csvBtn" class="linkbtn" type="button">⭳ Скачать CSV</button>
        </div>

        <div class="card hidden" id="breakdown"></div>

        <div class="card hidden" id="trend"></div>

        <div class="card" id="list">
            <div class="empty">Загрузка…</div>
        </div>
    </div>
</div>

<!-- Подсказка над сектором donut-диаграммы при наведении мышью (JS двигает и заполняет её). -->
<div class="donut-tip hidden" id="donutTip"></div>

<script>
    const API = '/api/expenses';
    const errorEl = document.getElementById('error');
    const listEl = document.getElementById('list');
    const totalEl = document.getElementById('total');
    const breakdownEl = document.getElementById('breakdown');
    const loginCard = document.getElementById('loginCard');
    const appArea = document.getElementById('appArea');
    const loginError = document.getElementById('loginError');

    let allData = [];            // все траты, как пришли с сервера
    let currentPeriod = 'month'; // выбранный период: today | week | month | all
    let budgetValue = null;      // месячный бюджет (null — не задан)

    // --- Токен доступа хранится в localStorage этого браузера ---
    function getToken() { return localStorage.getItem('apiToken') || ''; }
    function setToken(t) {
        if (t) localStorage.setItem('apiToken', t);
        else localStorage.removeItem('apiToken');
    }

    function showLogin(msg) {
        loginError.textContent = msg || '';
        loginCard.classList.remove('hidden');
        appArea.classList.add('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
        document.getElementById('who').classList.add('hidden');
    }
    function showApp() {
        loginCard.classList.add('hidden');
        appArea.classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        loadMe(); // подтянуть имя вошедшего пользователя в шапку
    }

    // Узнать имя текущего пользователя (/api/me) и показать его под заголовком.
    async function loadMe() {
        const el = document.getElementById('who');
        try {
            const res = await apiFetch('/api/me');
            if (!res.ok) { el.classList.add('hidden'); return; }
            const me = await res.json();
            el.textContent = 'Вошёл как: ' + me.name;
            el.classList.remove('hidden');
        } catch (e) {
            el.classList.add('hidden'); // 401 обработает apiFetch (покажет вход)
        }
    }

    // Обёртка над fetch: добавляет токен в заголовок и обрабатывает 401 (неверный токен).
    async function apiFetch(path, opts = {}) {
        const headers = Object.assign({}, opts.headers || {}, {
            'Authorization': 'Bearer ' + getToken(),
        });
        const res = await fetch(path, Object.assign({}, opts, { headers }));
        if (res.status === 401) {
            setToken('');
            showLogin('Неверный токен. Введите правильный.');
            throw new Error('Не авторизовано (401)');
        }
        return res;
    }

    function money(v) { return Number.isInteger(v) ? String(v) : String(v); }

    // Категориальная палитра (референс dataviz-гайда): 8 оттенков в фиксированном порядке под
    // светлую/тёмную тему; цвет закреплён за категорией. Остальное («прочее», «без категории») — серый.
    const CAT_ORDER = ['еда', 'транспорт', 'дом', 'развлечения', 'здоровье', 'одежда', 'связь', 'подарки'];
    const CAT_HUES_LIGHT = ['#2a78d6', '#008300', '#e87ba4', '#eda100', '#1baf7a', '#eb6834', '#4a3aa7', '#e34948'];
    const CAT_HUES_DARK = ['#3987e5', '#008300', '#d55181', '#c98500', '#199e70', '#d95926', '#9085e9', '#e66767'];
    function catColor(group) {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const i = CAT_ORDER.indexOf(group);
        if (i >= 0) return (dark ? CAT_HUES_DARK : CAT_HUES_LIGHT)[i];
        return dark ? '#6b7280' : '#9aa0a6';
    }

    function fmtDate(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return iso.slice(0, 16);
        const p = (n) => String(n).padStart(2, '0');
        return `${p(d.getDate())}.${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    // Начало сегодняшнего дня (00:00) — от него отсчитываем периоды.
    function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }

    // Попадает ли трата в выбранный период. Неделя = последние 7 дней, месяц = последние 30 дней.
    function inPeriod(iso) {
        if (currentPeriod === 'all') return true;
        const d = new Date(iso);
        if (isNaN(d)) return true;
        const today0 = startOfToday();
        if (currentPeriod === 'today') return d >= today0;
        const start = new Date(today0);
        start.setDate(start.getDate() - (currentPeriod === 'week' ? 6 : 29));
        return d >= start;
    }

    async function load() {
        errorEl.textContent = '';
        try {
            const res = await apiFetch(API);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            data.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
            allData = data;
            const bRes = await apiFetch('/api/budget');
            budgetValue = bRes.ok ? (await bRes.json()).monthlyBudget : null;
            renderBudget();
            applyView();
        } catch (e) {
            if (e.message.includes('401')) return;
            listEl.innerHTML = '<div class="empty">Не удалось загрузить траты</div>';
            errorEl.textContent = 'Ошибка сети: ' + e.message;
        }
    }

    // Пересчитать и перерисовать всё под выбранный период.
    function applyView() {
        const data = allData.filter((e) => inPeriod(e.createdAt));
        renderTotal(data);
        renderBreakdown(data);
        renderTrend(data);
        renderList(data);
    }

    // Относится ли трата к текущему календарному месяцу (для бюджета).
    function inCurrentMonth(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return false;
        const now = new Date();
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }

    // Карточка бюджета: сколько потрачено за календарный месяц против лимита.
    function renderBudget() {
        const el = document.getElementById('budget');
        const spent = allData.filter((e) => inCurrentMonth(e.createdAt)).reduce((s, e) => s + e.amount, 0);
        if (budgetValue == null) {
            el.innerHTML = `<div class="topbar"><span class="bd-title">Бюджет на месяц</span>
                <button class="linkbtn" id="setBudget">Задать</button></div>
                <div class="hint">Не задан. Нажми «Задать», чтобы установить лимит.</div>`;
        } else {
            const left = budgetValue - spent;
            const over = left < 0;
            const pct = budgetValue > 0 ? Math.min(100, Math.round(spent / budgetValue * 100)) : 0;
            const barColor = over ? 'var(--danger)' : 'var(--accent)';
            const leftText = over ? 'Перерасход: ' + money(-left) + ' ₽' : 'Осталось: ' + money(left) + ' ₽';
            el.innerHTML = `<div class="topbar"><span class="bd-title">Бюджет на месяц</span>
                <button class="linkbtn" id="setBudget">Изменить</button></div>
                <div>Потрачено ${money(spent)} из ${money(budgetValue)} ₽</div>
                <div class="bd-bar" style="margin:8px 0"><div style="width:${pct}%;background:${barColor}"></div></div>
                <div style="color:${over ? 'var(--danger)' : 'var(--muted)'}">${leftText}</div>`;
        }
        document.getElementById('setBudget').addEventListener('click', editBudget);
    }

    async function editBudget() {
        const cur = budgetValue == null ? '' : String(budgetValue);
        const input = prompt('Бюджет на месяц (₽). Оставь пустым, чтобы убрать бюджет:', cur);
        if (input === null) return; // нажали "Отмена"
        const v = input.trim() === '' ? null : parseFloat(input.replace(',', '.'));
        try {
            await apiFetch('/api/budget', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ monthlyBudget: (v && v > 0) ? v : null }),
            });
            load();
        } catch (e) {
            if (!e.message.includes('401')) errorEl.textContent = 'Не удалось сохранить бюджет: ' + e.message;
        }
    }

    function renderTotal(data) {
        const sum = data.reduce((s, e) => s + e.amount, 0);
        totalEl.innerHTML = `Всего за период: <b>${money(sum)} ₽</b> · ${data.length} трат`;
    }

    // Разбивка по обобщённым категориям (от ИИ): кольцевая диаграмма + легенда.
    function renderBreakdown(data) {
        if (data.length === 0) { breakdownEl.classList.add('hidden'); return; }
        breakdownEl.classList.remove('hidden');
        const total = data.reduce((s, e) => s + e.amount, 0);
        const map = {};
        data.forEach((e) => {
            const g = e.categoryGroup || 'без категории';
            map[g] = (map[g] || 0) + e.amount;
        });
        // Все группы (их не больше ~10), по убыванию — чтобы доли складывались в целое кольцо.
        const groups = Object.entries(map).sort((a, b) => b[1] - a[1]);

        // Кольцо через conic-gradient: доли идут подряд.
        let acc = 0;
        const stops = groups.map(([g, sum]) => {
            const from = total > 0 ? acc / total * 100 : 0;
            acc += sum;
            const to = total > 0 ? acc / total * 100 : 0;
            return `${catColor(g)} ${from}% ${to}%`;
        }).join(', ');

        // Легенда: цветной маркер + название + сумма и доля.
        const legend = groups.map(([g, sum]) => {
            const pct = total > 0 ? Math.round(sum / total * 100) : 0;
            return `<div class="bd-row"><div class="bd-head">
                <span><span class="dot" style="background:${catColor(g)}"></span>${escapeHtml(g)}</span>
                <span>${money(sum)} ₽ · ${pct}%</span></div></div>`;
        }).join('');

        breakdownEl.innerHTML = `<div class="topbar"><span class="bd-title">По категориям</span>
            <button class="linkbtn" id="reclassifyBtn" title="Определить категории через ИИ">↻ ИИ</button></div>
            <div class="donut" id="donut" style="background: conic-gradient(${stops})">
                <div class="donut-hole"><span>${money(total)} ₽</span></div>
            </div>
            ${legend}`;
        document.getElementById('reclassifyBtn').addEventListener('click', reclassify);
        attachDonutHover(groups, total);
    }

    // Наведение на кольцевую диаграмму: conic-gradient рисует секторы одной заливкой без
    // отдельных DOM-элементов, поэтому обычный title на каждый сектор не повесить — считаем
    // угол курсора от центра вручную и сравниваем с границами долей (те же проценты, что
    // ушли в conic-gradient). conic-gradient идёт по часовой стрелке от 12 часов — так же
    // считаем и угол наведения.
    function attachDonutHover(groups, total) {
        const donutEl = document.getElementById('donut');
        const tip = document.getElementById('donutTip');
        let acc = 0;
        const sectors = groups.map(([g, sum]) => {
            const from = total > 0 ? acc / total * 360 : 0;
            acc += sum;
            const to = total > 0 ? acc / total * 360 : 0;
            return { group: g, sum, from, to };
        });

        donutEl.addEventListener('mousemove', (ev) => {
            const rect = donutEl.getBoundingClientRect();
            const scale = rect.width / 170; // диаграмма всегда 170px, но на всякий случай пересчитываем
            const dx = ev.clientX - (rect.left + rect.width / 2);
            const dy = ev.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            const holeR = 51 * scale; // радиус дырки (inset 34px от радиуса 85px)
            const outerR = rect.width / 2;
            if (dist < holeR || dist > outerR) { tip.classList.add('hidden'); return; }

            let deg = Math.atan2(dx, -dy) * 180 / Math.PI; // 0° = 12 часов, по часовой стрелке
            if (deg < 0) deg += 360;
            const hit = sectors.find((s) => deg >= s.from && deg < s.to);
            if (!hit) { tip.classList.add('hidden'); return; }

            const pct = total > 0 ? Math.round(hit.sum / total * 100) : 0;
            tip.textContent = `${hit.group}: ${money(hit.sum)} ₽ · ${pct}%`;
            tip.style.left = (ev.clientX + 12) + 'px';
            tip.style.top = (ev.clientY + 12) + 'px';
            tip.classList.remove('hidden');
        });
        donutEl.addEventListener('mouseleave', () => tip.classList.add('hidden'));
    }

    // Скачать все траты в CSV. Токен нужен в заголовке, поэтому качаем через fetch и сохраняем
    // как файл через временную ссылку (обычный <a href> заголовок Authorization не отправит).
    async function downloadCsv() {
        try {
            const res = await apiFetch('/api/expenses.csv');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'expenses.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (e) {
            if (!e.message.includes('401')) errorEl.textContent = 'Не удалось скачать CSV: ' + e.message;
        }
    }

    // Попросить сервер проставить категории тратам, у которых их ещё нет (через ИИ).
    async function reclassify() {
        try {
            const res = await apiFetch('/api/reclassify', { method: 'POST' });
            const r = res.ok ? await res.json() : { pending: 0 };
            errorEl.textContent = `ИИ обрабатывает ${r.pending} трат без категории… обновлю через несколько секунд.`;
            setTimeout(load, 5000);
        } catch (e) {
            if (!e.message.includes('401')) errorEl.textContent = 'Не удалось запустить: ' + e.message;
        }
    }

    // Разбить траты периода на столбики по времени: неделя/месяц — по дням, «Всё» — по месяцам.
    // «Сегодня» — один день, тренда нет → пустой список (график скрыт).
    function buildTrend(data) {
        if (currentPeriod === 'today') return [];
        const dated = data
            .map((e) => ({ d: new Date(e.createdAt), amt: e.amount }))
            .filter((x) => !isNaN(x.d));
        if (dated.length === 0) return [];
        const today0 = startOfToday();

        if (currentPeriod === 'all') {
            // По календарным месяцам, от первого месяца с тратами до текущего.
            const map = {};
            let min = dated[0].d;
            dated.forEach((x) => {
                if (x.d < min) min = x.d;
                const key = x.d.getFullYear() + '-' + x.d.getMonth();
                map[key] = (map[key] || 0) + x.amt;
            });
            const bars = [];
            let y = min.getFullYear(), m = min.getMonth();
            const endY = today0.getFullYear(), endM = today0.getMonth();
            while (y < endY || (y === endY && m <= endM)) {
                const label = String(m + 1).padStart(2, '0') + '.' + String(y % 100).padStart(2, '0');
                bars.push({ label, amount: map[y + '-' + m] || 0 });
                m++; if (m > 11) { m = 0; y++; }
            }
            return bars;
        }

        // Неделя/месяц — непрерывный ряд последних 7 или 30 дней (пустые дни = 0).
        const days = currentPeriod === 'week' ? 7 : 30;
        const start = new Date(today0);
        start.setDate(start.getDate() - (days - 1));
        const map = {};
        dated.forEach((x) => {
            const day = new Date(x.d); day.setHours(0, 0, 0, 0);
            if (day >= start) map[day.getTime()] = (map[day.getTime()] || 0) + x.amt;
        });
        const bars = [];
        for (let i = 0; i < days; i++) {
            const day = new Date(start);
            day.setDate(day.getDate() + i);
            bars.push({ label: String(day.getDate()), amount: map[day.getTime()] || 0 });
        }
        return bars;
    }

    // График трат по времени: столбики (одна серия, один акцентный цвет; заголовок называет серию).
    function renderTrend(data) {
        const el = document.getElementById('trend');
        const bars = buildTrend(data);
        if (bars.length === 0) { el.classList.add('hidden'); return; }
        el.classList.remove('hidden');
        const max = Math.max.apply(null, bars.map((b) => b.amount).concat([1]));
        const peak = bars.reduce((a, b) => (b.amount > a.amount ? b : a), bars[0]);
        const step = Math.max(1, Math.ceil(bars.length / 8)); // подписи не для каждого столбика

        const barsHtml = bars.map((b) => {
            const h = Math.round(b.amount / max * 100);
            return `<div class="tbar" title="${escapeHtml(b.label)}: ${money(b.amount)} ₽">
                <div class="tbar-fill" style="height:${h}%"></div></div>`;
        }).join('');
        const labelsHtml = bars.map((b, i) =>
            `<span>${i % step === 0 ? escapeHtml(b.label) : ''}</span>`).join('');
        const peakText = peak && peak.amount > 0
            ? `Пик: ${money(peak.amount)} ₽ (${escapeHtml(peak.label)})` : '';

        el.innerHTML = `<div class="bd-title">По времени</div>
            <div class="hint" style="margin-top:0">${peakText}</div>
            <div class="trend-bars">${barsHtml}</div>
            <div class="trend-labels">${labelsHtml}</div>`;
    }

    function renderList(data) {
        if (data.length === 0) {
            listEl.innerHTML = '<div class="empty">За этот период трат нет.</div>';
            return;
        }
        listEl.innerHTML = data.map((e) => `
            <div class="row">
                <div class="info">
                    <div class="cat">${escapeHtml(e.category)}</div>
                    <div class="date">${fmtDate(e.createdAt)}${e.categoryGroup ? ' · ' + escapeHtml(e.categoryGroup) : ''}${e.note ? ' · ' + escapeHtml(e.note) : ''}</div>
                </div>
                <div class="amt">${money(e.amount)} ₽</div>
                <button class="edit" title="Изменить" data-id="${e.id}">✎</button>
                <button class="del" title="Удалить" data-id="${e.id}">✕</button>
            </div>
        `).join('');

        listEl.querySelectorAll('.del').forEach((btn) => {
            btn.addEventListener('click', () => del(btn.dataset.id));
        });
        listEl.querySelectorAll('.edit').forEach((btn) => {
            btn.addEventListener('click', () => editExpense(btn.dataset.id));
        });
    }

    // Правка траты: спрашиваем новую категорию и сумму, шлём PUT (категорию ИИ пересчитываем).
    async function editExpense(id) {
        const e = allData.find((x) => x.id === id);
        if (!e) return;
        const category = prompt('Категория:', e.category);
        if (category === null) return;
        const amountStr = prompt('Сумма:', String(e.amount));
        if (amountStr === null) return;
        const amount = parseFloat(amountStr.replace(',', '.'));
        if (!category.trim() || isNaN(amount) || amount <= 0) {
            errorEl.textContent = 'Введите категорию и сумму больше нуля';
            return;
        }
        try {
            const res = await apiFetch(`${API}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount, category: category.trim(), note: e.note, categoryGroup: null }),
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            load();
        } catch (err) {
            if (!err.message.includes('401')) errorEl.textContent = 'Не удалось изменить: ' + err.message;
        }
    }

    // Свой id для новой траты — если запрос уйдёт, но ответ потеряется (обрыв связи), повторный
    // клик "Добавить" отправит тот же id, и сервер не создаст вторую запись (см. NewExpense.id).
    function newId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        // Запасной вариант для очень старых браузеров без crypto.randomUUID.
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    async function del(id) {
        try {
            const res = await apiFetch(`${API}/${id}`, { method: 'DELETE' });
            if (!res.ok && res.status !== 204) throw new Error('HTTP ' + res.status);
            load();
        } catch (e) {
            if (!e.message.includes('401')) errorEl.textContent = 'Не удалось удалить: ' + e.message;
        }
    }

    // --- Обработчики ---
    document.querySelectorAll('#periods button').forEach((btn) => {
        btn.addEventListener('click', () => {
            currentPeriod = btn.dataset.period;
            document.querySelectorAll('#periods button').forEach((b) => b.classList.toggle('active', b === btn));
            applyView();
        });
    });

    document.getElementById('loginForm').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const t = document.getElementById('token').value.trim();
        if (!t) return;
        setToken(t);
        document.getElementById('token').value = '';
        showApp();
        load();
    });

    // Регистрация: спрашиваем имя, создаём аккаунт, сохраняем токен и входим.
    document.getElementById('registerBtn').addEventListener('click', async () => {
        const name = prompt('Ваше имя (для нового аккаунта):');
        if (name === null) return;
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.trim() || 'Пользователь' }),
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            setToken(data.token);
            alert('Аккаунт создан! Твой токен (сохрани его — он нужен для входа в приложении и связи с ботом):\n\n' + data.token);
            showApp();
            load();
        } catch (e) {
            loginError.textContent = 'Не удалось зарегистрироваться: ' + e.message;
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        setToken('');
        showLogin();
    });

    document.getElementById('csvBtn').addEventListener('click', downloadCsv);

    document.getElementById('addForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        errorEl.textContent = '';
        const category = document.getElementById('category').value.trim();
        const amountRaw = document.getElementById('amount').value.replace(',', '.');
        const noteRaw = document.getElementById('note').value.trim();
        const amount = parseFloat(amountRaw);
        if (!category || isNaN(amount) || amount <= 0) {
            errorEl.textContent = 'Введите категорию и сумму больше нуля';
            return;
        }
        const btn = document.getElementById('addBtn');
        btn.disabled = true;
        try {
            const res = await apiFetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount, category, note: noteRaw || null, id: newId() }),
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            document.getElementById('category').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            load();
        } catch (e) {
            if (!e.message.includes('401')) errorEl.textContent = 'Не удалось добавить: ' + e.message;
        } finally {
            btn.disabled = false;
        }
    });

    // При открытии: если токен уже сохранён — показываем приложение, иначе — вход.
    if (getToken()) {
        showApp();
        load();
    } else {
        showLogin();
    }
</script>
</body>
