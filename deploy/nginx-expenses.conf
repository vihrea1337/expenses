# server-блок reverse-proxy для Expenses.
#
# ВАЖНО: на боевом сервере этот блок уже включён в общий конфиг
#   vihrea1337/vpn-stack -> reverse-proxy/nginx.conf
# (там один nginx разводит VPN, сайт и Expenses). Здесь — справочная копия
# на случай, если Expenses разворачивается за отдельным nginx.
#
# Ожидает, что перед этим TLS-фронтом стоит SNI-роутер, направляющий сюда весь
# не-VPN трафик (см. nginx.conf в vpn-stack). Сертификат — Let's Encrypt.

server {
    listen 127.0.0.1:8081 ssl;
    http2 on;
    server_name sashlevhealth.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/sashlevhealth.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sashlevhealth.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;          # Ktor-служба на хосте
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
